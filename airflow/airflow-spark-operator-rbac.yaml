apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: spark-dgd
  name: airflow-spark-operator-role
rules:
- apiGroups: ["sparkoperator.k8s.io"]
  resources:
  - sparkapplications
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update

- apiGroups: [""]
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-operator-binding
  namespace: spark-dgd
subjects:
- kind: ServiceAccount
  name: airflow-worker
  namespace: airflow-dgd
roleRef:
  kind: Role
  name: airflow-spark-operator-role
  apiGroup: rbac.authorization.k8s.io